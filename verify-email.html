<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Verify your email address to activate your AFEDEV account." />
    <meta property="og:image" content="/images/logo-new.png" />
    <meta name="twitter:image" content="/images/logo-new.png" />
    <title>Verify Email — AFEDEV</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300..800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body data-page="verify-email">
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="site-header"></div>

    <header class="page-hero">
      <div class="container">
        <nav class="breadcrumb-nav" aria-label="Breadcrumb">
          <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">Verify Email</li>
          </ol>
        </nav>
        <h1 class="page-hero-title display-5">Verify Your Email</h1>
        <p class="page-hero-lead lead">
          Enter the verification code we sent to your email address to activate your account.
        </p>
      </div>
    </header>

    <main id="main">
      <section class="section">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
              <div class="form-card">
                <p id="emailInfo" class="text-center mb-4">
                  We sent a verification code to your email address.
                </p>

                <div id="successAlert" class="alert alert-success d-none" aria-live="polite"></div>
                <div id="errorAlert" class="alert alert-danger d-none" aria-live="polite"></div>

                <form id="verifyForm" class="registration-form" novalidate>
                  <div class="mb-3">
                    <label for="token" class="form-label">Verification Code</label>
                    <input
                      type="text"
                      class="form-control"
                      id="token"
                      name="token"
                      autocomplete="one-time-code"
                      required
                    />
                    <div class="invalid-feedback" aria-live="polite">Please enter your verification code.</div>
                  </div>

                  <button type="submit" class="btn btn-brand w-100">
                    Verify Email
                    <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                  </button>
                </form>

                <div class="text-center mt-4">
                  <button id="resendBtn" type="button" class="btn btn-outline-light btn-sm">
                    Resend verification code
                  </button>
                  <p id="resendStatus" class="resend-timer mt-2"></p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
