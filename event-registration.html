<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Register to attend an AFEDEV event. Secure your spot at upcoming American football events, exhibitions, and showcases." />
    <meta property="og:image" content="/images/logo-new.png" />
    <meta name="twitter:image" content="/images/logo-new.png" />
    <title>Event Registration — AFEDEV</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300..800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body data-page="event-registration">
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="site-header"></div>

    <header class="page-hero">
      <div class="container">
        <nav class="breadcrumb-nav" aria-label="Breadcrumb">
          <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/">Home</a></li>
            <li class="breadcrumb-item"><a href="/events.html">Events</a></li>
            <li class="breadcrumb-item active" aria-current="page">Event Registration</li>
          </ol>
        </nav>
        <h1 class="page-hero-title display-5" id="pageTitle">Event Registration</h1>
        <p class="page-hero-lead lead" id="pageLead">
          Secure your spot at this upcoming AFEDEV event.
        </p>
      </div>
    </header>

    <main id="main">
      <section class="section">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">

              <!-- Event details panel -->
              <div class="event-registration-details panel p-4 mb-4" id="eventDetails">
                <div class="d-flex align-items-center gap-2 mb-3">
                  <span class="statement-kicker mb-0">Event Details</span>
                </div>
                <h2 class="h5 mb-2" id="eventName">Loading event details...</h2>
                <ul class="list-unstyled text-white-75 mb-0" id="eventMeta">
                  <li class="mb-1"><span aria-hidden="true">📅</span> <span id="eventDate">—</span></li>
                  <li class="mb-1"><span aria-hidden="true">🕐</span> <span id="eventTime">—</span></li>
                  <li><span aria-hidden="true">📍</span> <span id="eventVenue">—</span></li>
                </ul>
              </div>

              <!-- Registration form card -->
              <div class="form-card">
                <div id="successAlert" class="alert alert-success d-none" role="alert" aria-live="polite"></div>
                <div id="errorAlert" class="alert alert-danger d-none" role="alert" aria-live="polite"></div>

                <form id="eventRegistrationForm" class="registration-form" novalidate>
                  <div class="mb-3">
                    <label for="name" class="form-label">Full Name <span class="text-danger">*</span></label>
                    <input
                      type="text"
                      class="form-control"
                      id="name"
                      name="name"
                      maxlength="100"
                      autocomplete="name"
                      placeholder="Enter your full name"
                      required
                    />
                    <div class="invalid-feedback" aria-live="polite"></div>
                  </div>

                  <div class="mb-3">
                    <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                    <input
                      type="email"
                      class="form-control"
                      id="email"
                      name="email"
                      maxlength="255"
                      autocomplete="email"
                      placeholder="you@example.com"
                      required
                    />
                    <div class="invalid-feedback" aria-live="polite"></div>
                  </div>

                  <div class="mb-3">
                    <label for="phone" class="form-label">Phone Number <span class="text-muted small">(optional)</span></label>
                    <input
                      type="tel"
                      class="form-control"
                      id="phone"
                      name="phone"
                      maxlength="20"
                      autocomplete="tel"
                      placeholder="+234..."
                    />
                    <div class="invalid-feedback" aria-live="polite"></div>
                  </div>

                  <button type="submit" class="btn btn-brand w-100 py-2">
                    Register to Attend
                    <span class="spinner-border spinner-border-sm d-none ms-2" role="status" aria-hidden="true"></span>
                  </button>
                </form>

                <p class="mt-3 text-center text-muted small">
                  By registering, you agree to AFEDEV's <a href="/legal.html">privacy policy</a>.
                </p>
              </div>

            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <button
      id="toTop"
      class="to-top-btn"
      aria-label="Back to top"
      type="button"
    >↑</button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
